description: 'Aurizon (Aurizon Holdings Limited, ASX: AZJ, formerly QR National) describes itself as Australia''s largest rail freight operator. Its own site says it moves more than 250 million tonnes of Australian commodities each year to domestic and international markets, across coal, bulk and containerised freight, and it also runs a rail network business. Customers and suppliers use web portals such as FreightOnline and Customer Online. Aurizon does not publish a public developer portal or API documentation.'

